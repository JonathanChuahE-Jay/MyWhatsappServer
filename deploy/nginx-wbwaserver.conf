# Add this block inside your existing `server { ... }` for whatsbet.jona.my,
# directly under your existing `location /ws/ { ... }` block.
#
# Docker compose binds wbwaserver to 127.0.0.1:2124.
# External API URL example: https://whatsbet.jona.my/whatsapp/health
# External WebSocket URL: wss://whatsbet.jona.my/whatsapp/ws?api_key=YOUR_KEY

location /whatsapp/ {
    proxy_pass http://127.0.0.1:2124/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support for /whatsapp/ws
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
