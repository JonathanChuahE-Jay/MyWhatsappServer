services:
  wbwaserver:
    build: .
    container_name: wbwaserver
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 2124
      SESSIONS_DIR: /app/sessions
    ports:
      # Bind only to localhost; let Nginx proxy public traffic to it.
      - "127.0.0.1:2124:2124"
    volumes:
      # Persist session metadata on the host so ./sessions/sessions.json is visible
      # outside the container. Baileys auth credentials are still stored in Redis.
      - ./sessions:/app/sessions
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:'+(process.env.PORT||2124)+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
